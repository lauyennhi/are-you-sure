<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AUS — Bộ sưu tập</title>
<style>
  :root { --green:#1F3D2B; --sand:#E8DCC4; --purple:#8B5CF6; --line:rgba(31,61,43,.16); --mute:rgba(31,61,43,.62); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--sand); color:var(--green); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  header { background:var(--green); color:var(--sand); padding:18px 24px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:18px; flex:1; }
  header input { border:1px solid rgba(232,220,196,.4); background:transparent; color:var(--sand); border-radius:999px; padding:8px 14px; min-width:220px; font-size:13px; outline:none; }
  header input::placeholder { color:rgba(232,220,196,.6); }
  button { font-family:inherit; border:1.5px solid var(--line); background:transparent; color:inherit; border-radius:999px; padding:6px 12px; font-size:12px; cursor:pointer; }
  header button { border-color:rgba(232,220,196,.4); }
  button:hover { background:rgba(139,92,246,.15); }
  button.danger:hover { background:var(--green); color:var(--sand); }
  main { max-width:820px; margin:0 auto; padding:20px 16px 60px; }
  .empty { text-align:center; color:var(--mute); padding:60px 0; line-height:1.7; }
  .card { background:rgba(255,255,255,.5); border:1px solid var(--line); border-radius:18px; padding:16px 18px; margin-bottom:14px; }
  .card.hl { outline:3px solid var(--purple); }
  .meta { font-size:11.5px; color:var(--mute); display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .meta a { color:var(--purple); text-decoration:none; font-weight:600; }
  blockquote { margin:10px 0; padding-left:12px; border-left:3px solid var(--purple); font-style:italic; font-size:14px; line-height:1.55; }
  .stats { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  .pill { font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px; background:var(--green); color:var(--sand); }
  .pill.p { background:var(--purple); color:#fff; }
  .actions { display:flex; gap:8px; margin-top:10px; }
  .detail { margin-top:12px; border-top:1px dashed var(--line); padding-top:10px; font-size:13px; line-height:1.55; }
  .detail h4 { margin:12px 0 4px; font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); }
  .detail p { margin:4px 0; }
  .detail a { color:var(--purple); }
  textarea { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:8px 10px; font:inherit; font-size:12.5px; background:#fff; color:var(--green); resize:vertical; min-height:52px; }
</style>
</head>
<body>
<header>
  <h1>▤ Bộ sưu tập góc nhìn</h1>
  <input id="q" type="search" placeholder="Tìm trong bộ sưu tập..." />
  <button id="export">Xuất JSON</button>
</header>
<main id="list"></main>
<script src="collection.js"></script>
</body>
</html>
