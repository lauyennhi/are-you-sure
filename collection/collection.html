<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AUS — Bộ sưu tập</title>
<style>
  :root { --bg:#fff; --surface:#f5f5f5; --surface2:#ececec; --text:#0a0a0a; --mute:#6b6b6b; --line:#e4e4e4; --inv:#0a0a0a; --inv-text:#fff; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --ok-bg:rgba(22,163,74,.12); --warn-bg:rgba(217,119,6,.14); --bad-bg:rgba(220,38,38,.12); }
  :root[data-theme="dark"] { --bg:#111113; --surface:#1b1b1e; --surface2:#26262a; --text:#f4f4f5; --mute:#9a9aa2; --line:#2c2c31; --inv:#f4f4f5; --inv-text:#0a0a0a; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --ok-bg:rgba(74,222,128,.14); --warn-bg:rgba(251,191,36,.14); --bad-bg:rgba(248,113,113,.14); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111113; --surface:#1b1b1e; --surface2:#26262a; --text:#f4f4f5; --mute:#9a9aa2; --line:#2c2c31; --inv:#f4f4f5; --inv-text:#0a0a0a; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --ok-bg:rgba(74,222,128,.14); --warn-bg:rgba(251,191,36,.14); --bad-bg:rgba(248,113,113,.14); } }
  @font-face { font-family:"AUS Inter"; src:url("../fonts/inter-vietnamese-wght-normal.woff2") format("woff2"); font-weight:100 900; unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB; }
  @font-face { font-family:"AUS Inter"; src:url("../fonts/inter-latin-ext-wght-normal.woff2") format("woff2"); font-weight:100 900; unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family:"AUS Inter"; src:url("../fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight:100 900; unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  * { box-sizing: border-box; }
  body { font-family:"AUS Inter",Inter,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }

  body { margin:0; }
  header { padding:20px 24px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:1; }
  header h1 { margin:0; font-size:18px; letter-spacing:-.02em; flex:1; }
  header input { border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:999px; padding:9px 16px; min-width:220px; font:inherit; font-size:13px; outline:none; }
  header input:focus { border-color:var(--text); }
  button { font:inherit; border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:999px; padding:7px 14px; font-size:12px; font-weight:600; cursor:pointer; }
  button:hover { background:var(--surface); }
  button.danger:hover { color:var(--bad); border-color:var(--bad); }
  main { max-width:820px; margin:0 auto; padding:20px 16px 60px; }
  .empty { text-align:center; color:var(--mute); padding:80px 0; line-height:1.7; font-size:14px; }
  .card { background:var(--surface); border-radius:20px; padding:18px 20px; margin-bottom:14px; }
  .card.hl { outline:2px solid var(--text); }
  .meta { font-size:11.5px; color:var(--mute); display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .meta a { color:var(--text); font-weight:600; text-decoration:none; }
  blockquote { margin:12px 0; padding-left:14px; border-left:3px solid var(--text); font-style:italic; font-size:14px; line-height:1.55; }
  .stats { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
  .pill { font-size:11.5px; font-weight:700; padding:3px 11px; border-radius:999px; }
  .pill.ok { background:var(--ok-bg); color:var(--ok); } .pill.warn { background:var(--warn-bg); color:var(--warn); } .pill.bad { background:var(--bad-bg); color:var(--bad); }
  .actions { display:flex; gap:8px; margin-top:10px; }
  .detail { margin-top:14px; border-top:1px solid var(--line); padding-top:10px; font-size:13px; line-height:1.55; }
  .detail h4 { margin:14px 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--mute); font-weight:600; }
  .detail p { margin:4px 0; }
  .detail a { color:var(--text); }
  textarea { width:100%; border:1px solid var(--line); border-radius:14px; padding:10px 12px; font:inherit; font-size:12.5px; background:var(--bg); color:var(--text); resize:vertical; min-height:56px; outline:none; }
  textarea:focus { border-color:var(--text); }
</style>
<script src="../theme.js"></script>
</head>
<body>
<header>
  <h1>Bộ sưu tập</h1>
  <input id="q" type="search" placeholder="Tìm kiếm..." />
  <button id="theme" title="Đổi giao diện">Tự động</button>
  <button id="export">Xuất JSON</button>
</header>
<main id="list"></main>
<script src="collection.js"></script>
</body>
</html>
