<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>AUS — Cài đặt</title>
<style>
  :root { --bg:#fff; --surface:#f5f5f5; --surface2:#ececec; --text:#0a0a0a; --mute:#6b6b6b; --line:#e4e4e4; --inv:#0a0a0a; --inv-text:#fff; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --ok-bg:rgba(22,163,74,.12); --warn-bg:rgba(217,119,6,.14); --bad-bg:rgba(220,38,38,.12); }
  :root[data-theme="dark"] { --bg:#111113; --surface:#1b1b1e; --surface2:#26262a; --text:#f4f4f5; --mute:#9a9aa2; --line:#2c2c31; --inv:#f4f4f5; --inv-text:#0a0a0a; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --ok-bg:rgba(74,222,128,.14); --warn-bg:rgba(251,191,36,.14); --bad-bg:rgba(248,113,113,.14); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111113; --surface:#1b1b1e; --surface2:#26262a; --text:#f4f4f5; --mute:#9a9aa2; --line:#2c2c31; --inv:#f4f4f5; --inv-text:#0a0a0a; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --ok-bg:rgba(74,222,128,.14); --warn-bg:rgba(251,191,36,.14); --bad-bg:rgba(248,113,113,.14); } }
  @font-face { font-family:"AUS Inter"; src:url("../fonts/inter-vietnamese-wght-normal.woff2") format("woff2"); font-weight:100 900; unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB; }
  @font-face { font-family:"AUS Inter"; src:url("../fonts/inter-latin-ext-wght-normal.woff2") format("woff2"); font-weight:100 900; unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family:"AUS Inter"; src:url("../fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight:100 900; unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  * { box-sizing: border-box; }
  body { font-family:"AUS Inter",Inter,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }

  body { width:320px; margin:0; padding:16px; }
  .brand { display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:15px; font-weight:700; letter-spacing:-.01em; }
  label { font-size:11.5px; color:var(--mute); display:block; margin:12px 0 4px; font-weight:600; }
  input[type="password"], input[type="text"] { width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:12px; font:inherit; font-size:12px; background:var(--surface); color:var(--text); outline:none; }
  input:focus { border-color:var(--text); }
  button { width:100%; padding:10px 0; border:none; border-radius:999px; background:var(--inv); color:var(--inv-text); font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; margin-top:12px; }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); margin-top:8px; }
  .row { display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:600; margin-top:6px; }
  .seg { display:flex; gap:2px; background:var(--surface); padding:3px; border-radius:999px; }
  .seg button { width:auto; margin:0; padding:5px 11px; background:transparent; color:var(--mute); font-size:11.5px; }
  .seg button.on { background:var(--bg); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.15); }
  .status { font-size:11.5px; color:var(--ok); margin-top:6px; min-height:14px; }
  .stats { font-size:11.5px; color:var(--mute); margin-top:14px; border-top:1px solid var(--line); padding-top:10px; line-height:1.7; }
  .hint { font-size:10.5px; color:var(--mute); margin-top:5px; line-height:1.45; }
  a { color:var(--text); }
  .list { font-size:11.5px; }
  .list span { display:inline-flex; gap:6px; align-items:center; background:var(--surface); border-radius:999px; padding:3px 4px 3px 10px; margin:3px 4px 0 0; }
  .list b { cursor:pointer; padding:0 6px; }
</style>
<script src="../theme.js"></script>
</head>
<body>
  <div class="brand"><img src="../icons/icon32.png" width="24" height="24" alt="" /> Are you sure?</div>

  <div class="row"><span>Bật gợi ý khi bôi đen</span><input type="checkbox" id="enabled" /></div>
  <div class="row"><span>Giao diện</span>
    <div class="seg" id="theme"><button data-t="auto">Tự động</button><button data-t="light">Sáng</button><button data-t="dark">Tối</button></div></div>

  <label for="apiKey">Gemini API Key (tuỳ chọn)</label>
  <input type="password" id="apiKey" placeholder="Dán API key tại đây..." autocomplete="off" />
  <label for="model">Model</label>
  <input type="text" id="model" placeholder="gemini-3.5-flash-lite" />
  <div class="hint">
    Chưa có key → <b>Chế độ demo</b> (dữ liệu mẫu, vẫn dùng được toàn bộ giao diện).
    Lấy key miễn phí: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">Google AI Studio</a>.
  </div>
  <button id="save">Lưu cấu hình</button>
  <div class="status" id="status"></div>

  <div id="muted" class="list"></div>

  <button class="secondary" id="openCollection">Mở bộ sưu tập</button>

  <div class="stats">
    <div id="collectionCount"></div>
    <div id="cacheCount"></div>
    <button class="secondary" id="clearCache">Xoá cache</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
