<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>AUS — Cài đặt</title>
<style>
  :root { --green:#1F3D2B; --sand:#E8DCC4; --purple:#8B5CF6; --line:rgba(31,61,43,.16); --mute:rgba(31,61,43,.62); }
  body { width:320px; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; margin:0; padding:16px; color:var(--green); background:var(--sand); }
  .brand { display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:15px; font-weight:800; }
  label { font-size:11.5px; color:var(--mute); display:block; margin:10px 0 4px; font-weight:600; }
  input[type="password"], input[type="text"] { width:100%; box-sizing:border-box; padding:9px 11px; border:1.5px solid var(--line); border-radius:12px; font-size:12px; background:#fff; color:var(--green); outline:none; }
  input:focus { border-color:var(--purple); }
  button { width:100%; padding:10px 0; border:none; border-radius:999px; background:var(--purple); color:#fff; font-size:12.5px; font-weight:700; cursor:pointer; margin-top:12px; }
  button.secondary { background:transparent; color:var(--green); border:1.5px solid var(--line); margin-top:8px; }
  .row { display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:600; }
  .status { font-size:11.5px; color:var(--purple); margin-top:6px; min-height:14px; }
  .stats { font-size:11.5px; color:var(--mute); margin-top:14px; border-top:1px solid var(--line); padding-top:10px; line-height:1.7; }
  .hint { font-size:10.5px; color:var(--mute); margin-top:5px; line-height:1.45; }
  a { color:var(--purple); }
  .list { font-size:11.5px; }
  .list span { display:inline-flex; gap:6px; align-items:center; background:rgba(255,255,255,.55); border-radius:999px; padding:3px 4px 3px 10px; margin:3px 4px 0 0; }
  .list b { cursor:pointer; padding:0 6px; }
</style>
</head>
<body>
  <div class="brand"><img src="../icons/icon32.png" width="24" height="24" alt="" /> Are you sure?</div>

  <div class="row"><span>Bật gợi ý khi bôi đen</span><input type="checkbox" id="enabled" /></div>

  <label for="apiKey">Gemini API Key (tuỳ chọn)</label>
  <input type="password" id="apiKey" placeholder="Dán API key tại đây..." autocomplete="off" />
  <label for="model">Model</label>
  <input type="text" id="model" placeholder="gemini-2.5-flash" />
  <div class="hint">
    Chưa có key → <b>Chế độ demo</b> (dữ liệu mẫu, vẫn dùng được toàn bộ giao diện).
    Lấy key miễn phí: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">Google AI Studio</a>.
  </div>
  <button id="save">Lưu cấu hình</button>
  <div class="status" id="status"></div>

  <div id="muted" class="list"></div>

  <button class="secondary" id="openCollection">▤ Mở bộ sưu tập</button>

  <div class="stats">
    <div id="collectionCount"></div>
    <div id="cacheCount"></div>
    <button class="secondary" id="clearCache">Xoá cache</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
